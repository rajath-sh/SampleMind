<text x="1200" y="1750" text-anchor="middle" dominant-baseline="middle" stroke="none" font-size="23" >ExperimentSample composite PK = (experiment_id, sample_id, usage_role). Each usage belongs to one experiment and one sample.</text>
<text x="1200" y="1790" text-anchor="middle" dominant-baseline="middle" stroke="none" font-size="23" >requested_at and quantity_used are relationship attributes mapped to their N-side tables. assay_count is derived, not stored.</text>
<text x="1200" y="1830" text-anchor="middle" dominant-baseline="middle" stroke="none" font-size="22" >Selected six-table scope only. Required ownership is shown by double lines; no unsupported weak-entity or partial-key notation is added.</text>
