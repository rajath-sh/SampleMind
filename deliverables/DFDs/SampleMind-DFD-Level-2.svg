<text x="2275" y="2962" text-anchor="middle" stroke="none" font-size="24" ><tspan x="2275" dy="0">D1 and D2 are the same stores as in Level 1. Repeated identifiers do not create new stores or new boundary flows.</tspan></text>
<text x="2275" y="3010" text-anchor="middle" stroke="none" font-size="24" ><tspan x="2275" dy="0">Level 2 is a detailed specimen-management decomposition, not a second context diagram or an ER relationship diagram.</tspan></text>
